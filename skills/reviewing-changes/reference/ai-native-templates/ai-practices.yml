# ai-native-reviewer-template-sha256: b0afbe8d13bb18fc17ddd7b829b0e59f1c0ef888ec2a6b1a7334d4579df983f3
#
# AI-native-coding mechanical checks. Wraps check-ai-practices.sh.
# Source: coding-skills plugin > skills/reviewing-changes/reference/ai-native-templates/
# Sync via: scripts/sync-ai-native-rubric.sh (stamps SHA + freshness)
#
name: ai-practices

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-practices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run mechanical AI-practices checks
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/check-ai-practices.sh
