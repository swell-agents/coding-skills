# ai-native-reviewer-template-sha256: b271809405313a80936255ba31d5499abe1b21396127c2c38f7f9f36790cf48b
#
# AI-native-coding mechanical checks. Wraps check-ai-practices.sh.
# Source: coding-skills plugin > skills/reviewing-changes/reference/ai-native-templates/
# SHA in the first line is auto-stamped by scripts/sync-ai-native-rubric.sh in the plugin repo.
#
name: ai-practices

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-practices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run mechanical AI-practices checks
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/check-ai-practices.sh
